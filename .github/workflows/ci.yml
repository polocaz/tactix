name: CI

on:
  push:
    branches: [master, 'phase-*', 'medieval-*']
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            xorg-dev libasound2-dev

      - name: Configure
        working-directory: c++
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: c++
        run: cmake --build build --config Release --parallel

      - name: Test (unit, determinism, counter+digest gate)
        working-directory: c++
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Record benchmark output (never gated on timing)
        working-directory: c++
        shell: bash
        run: |
          if [ -f build/Release/tactix_bench.exe ]; then
            BENCH=build/Release/tactix_bench.exe
          else
            BENCH=build/tactix_bench
          fi
          "$BENCH" --agents 2000 --ticks 200 --seed 42 --threads 2 --json

  tsan:
    name: ThreadSanitizer (Linux)
    runs-on: ubuntu-latest
    # This job GATES. It previously carried continue-on-error for a known race in
    # JobSystem::waitAll(), whose predicate read jobQueue.empty() while holding only
    # waitMutex. That read is now gone (it was redundant with the activeJobs count),
    # so there is nothing left to excuse.
    #
    # Gating here matters more than it looks: the simulation's whole determinism
    # guarantee rests on no parallel phase mutating another agent, and several tick
    # phases are still empty stubs that later work fills in. The digest test catches
    # a violation only when the race happens to change a result; TSan catches it on
    # the access itself. Do not reintroduce continue-on-error to get a red build
    # green. A race here is a real defect, not CI noise.
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            xorg-dev libasound2-dev

      - name: Configure (Debug + TSan)
        working-directory: c++
        run: |
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS=-fsanitize=thread \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread

      - name: Build tactix_tests
        working-directory: c++
        run: cmake --build build-tsan --target tactix_tests --parallel

      - name: Run tests under TSan
        working-directory: c++
        env:
          TSAN_OPTIONS: halt_on_error=0
        run: ./build-tsan/tactix_tests
